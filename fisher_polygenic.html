<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fisher의 무한소 모형 (Fisher's Infinitesimal Model)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a1a;
  --bg2: #0f0f2a;
  --accent: #2e7d32;
  --accent2: #1b5e20;
  --accent-light: #4caf50;
  --text: #e0e0f0;
  --text-dim: #8888aa;
  --glow: 0 0 20px rgba(46,125,50,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  overflow-x: hidden;
  line-height: 1.8;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

.header {
  text-align: center;
  padding: 60px 20px 30px;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(46,125,50,0.15) 0%, transparent 70%);
  pointer-events: none;
}
.header h1 {
  font-size: 2.8em;
  font-weight: 900;
  background: linear-gradient(135deg, #2e7d32, #4caf50, #81c784);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
}
.header .subtitle {
  font-size: 1.1em;
  color: var(--text-dim);
  font-weight: 300;
}

.container {
  max-width: 1020px;
  margin: 0 auto;
  padding: 0 20px 60px;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin: 20px 0 16px;
  flex-wrap: wrap;
}
.controls label {
  font-size: 1.1em;
  font-weight: 500;
  color: var(--text);
}
.controls input[type=range] {
  width: 320px;
  accent-color: var(--accent-light);
  height: 8px;
  cursor: pointer;
}
.controls .gene-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.3em;
  font-weight: 700;
  color: var(--accent-light);
  min-width: 40px;
  text-align: center;
}
.controls button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 18px;
  border-radius: 6px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.95em;
  cursor: pointer;
  transition: background 0.2s;
}
.controls button:hover { background: var(--accent-light); }
.controls button.active { background: var(--accent-light); box-shadow: var(--glow); }

.canvas-wrap {
  display: flex;
  justify-content: center;
}
canvas {
  display: block;
  max-width: 100%;
  height: auto;
  border-radius: 12px;
  background: var(--bg2);
}

.tooltip {
  position: fixed;
  pointer-events: none;
  background: rgba(15,15,42,0.95);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.9em;
  color: var(--text);
  display: none;
  z-index: 999;
  max-width: 340px;
  line-height: 1.6;
  font-family: 'Noto Sans KR', sans-serif;
  box-shadow: var(--glow);
}
.tooltip .swatch {
  display: inline-block;
  width: 18px; height: 18px;
  border-radius: 4px;
  vertical-align: middle;
  margin-left: 6px;
  border: 1px solid rgba(255,255,255,0.3);
}

/* Progress bar */
.progress-bar {
  position: fixed;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}
.progress-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #333;
  border: 2px solid #555;
  transition: all 0.3s;
  cursor: pointer;
}
.progress-dot.active {
  background: var(--accent-light);
  border-color: var(--accent-light);
  box-shadow: var(--glow);
}
</style>
</head>
<body>

<div class="progress-bar" id="progressBar">
  <div class="progress-dot active" title="시각화"></div>
</div>

<div class="header">
  <h1>Fisher의 무한소 모형</h1>
  <div class="subtitle">다유전자 형질과 정규분포 — 양적 유전학의 기초 (Fisher's Infinitesimal Model, 1918)</div>
</div>

<div class="container">
  <div class="controls">
    <label>유전자 수 (Number of Genes):</label>
    <input type="range" id="geneSlider" min="1" max="20" value="1" step="1">
    <span class="gene-val" id="geneVal">3</span>
    <button id="autoBtn">▶ 자동 재생 (Auto)</button>
  </div>
  <div class="canvas-wrap">
    <canvas id="mainCanvas" width="960" height="650"></canvas>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// ============================================================
// SLIDE MODE for recording
// ============================================================
const SLIDE_MODE = new URLSearchParams(window.location.search).has('slide');
const HD_MODE = new URLSearchParams(window.location.search).has('hd');
const SLIDE_BG = '#f0ece4';
const SLIDE_DPR = SLIDE_MODE ? (window.devicePixelRatio || 2) : 1;

if (SLIDE_MODE) {
  const pb = document.getElementById('progressBar');
  if (pb) pb.style.display = 'none';
  document.body.style.background = SLIDE_BG;
  document.querySelector('.header h1').style.background = 'linear-gradient(135deg, #1b5e20, #2e7d32)';
  document.querySelector('.header h1').style.webkitBackgroundClip = 'text';
  document.querySelector('.header h1').style.webkitTextFillColor = 'transparent';
  document.querySelector('.header .subtitle').style.color = '#666';
  document.querySelectorAll('.controls label, .gene-val').forEach(el => el.style.color = '#222');
  document.querySelector('.container').style.background = 'transparent';
}

function txtColor() { return SLIDE_MODE ? '#1a1a1a' : '#e0e0f0'; }
function dimColor() { return SLIDE_MODE ? '#555' : '#8888aa'; }
function subColor() { return SLIDE_MODE ? '#666' : '#aaa'; }
function canvasBg() { return SLIDE_MODE ? SLIDE_BG : '#0f0f2a'; }
function barBorder() { return SLIDE_MODE ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.15)'; }

// ============================================================
// Canvas setup
// ============================================================
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const W = 960, H = 650;

const CANVAS_DPR = SLIDE_MODE ? SLIDE_DPR : (HD_MODE ? (window.devicePixelRatio || 2) : 1);
if (SLIDE_MODE || HD_MODE) {
  canvas.width = W * CANVAS_DPR;
  canvas.height = H * CANVAS_DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (SLIDE_MODE) canvas.style.background = SLIDE_BG;
} else {
  canvas.width = W;
  canvas.height = H;
}

function resetTransform() {
  ctx.setTransform(CANVAS_DPR, 0, 0, CANVAS_DPR, 0, 0);
}

// ============================================================
// Math helpers
// ============================================================
function factorial(n) {
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
}
function binomCoeff(n, k) {
  if (k < 0 || k > n) return 0;
  if (k === 0 || k === n) return 1;
  let r = 1;
  for (let i = 0; i < Math.min(k, n - k); i++) {
    r = r * (n - i) / (i + 1);
  }
  return Math.round(r);
}
function binomProb(total, k) {
  return binomCoeff(total, k) / Math.pow(2, total);
}
function normalPDF(x, mu, sigma) {
  return (1 / (sigma * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x - mu) / sigma, 2));
}

// ============================================================
// Skin tone colors
// ============================================================
function skinColor(fraction) {
  // Interpolate from lightest to darkest
  const colors = [
    [255, 232, 208], // #ffe8d0
    [245, 213, 181], // #f5d5b5
    [222, 187, 152], // #debb98
    [196, 154, 108], // #c49a6c
    [166, 124, 82],  // #a67c52
    [139, 98, 64],   // #8b6240
    [112, 76, 48],   // #704c30
    [90, 56, 32],    // #5a3820
    [61, 28, 0],     // #3d1c00
  ];
  const t = Math.max(0, Math.min(1, fraction)) * (colors.length - 1);
  const i = Math.floor(t);
  const f = t - i;
  const c0 = colors[Math.min(i, colors.length - 1)];
  const c1 = colors[Math.min(i + 1, colors.length - 1)];
  const r = Math.round(c0[0] + (c1[0] - c0[0]) * f);
  const g = Math.round(c0[1] + (c1[1] - c0[1]) * f);
  const b = Math.round(c0[2] + (c1[2] - c0[2]) * f);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
// State
// ============================================================
let currentN = 1;
let targetN = 1;
let animBars = []; // current animated bar heights
let fromBars = []; // starting bar heights for animation
let targetBars = [];
let animProgress = 1;
let autoMode = false;
let autoTimer = 0;
let hoveredBar = -1;

// Bar geometry cache
let barRects = [];

function computeDistribution(n) {
  const total = 2 * n;
  const bars = [];
  for (let k = 0; k <= total; k++) {
    bars.push(binomProb(total, k));
  }
  return bars;
}

function initBars(n) {
  const newTarget = computeDistribution(n);
  const newLen = newTarget.length;
  // Save current state as "from"
  fromBars = new Array(newLen).fill(0);
  for (let i = 0; i < newLen; i++) {
    fromBars[i] = (i < animBars.length) ? animBars[i] : 0;
  }
  targetBars = newTarget;
  animBars = [...fromBars];
  animProgress = 0;
}

initBars(currentN);
animBars = [...targetBars];
fromBars = [...targetBars];
animProgress = 1;

// ============================================================
// Slider & controls
// ============================================================
const slider = document.getElementById('geneSlider');
const geneValEl = document.getElementById('geneVal');
const autoBtn = document.getElementById('autoBtn');
const tooltip = document.getElementById('tooltip');

slider.addEventListener('input', () => {
  const n = parseInt(slider.value);
  geneValEl.textContent = n;
  if (n !== currentN) {
    currentN = n;
    initBars(n);
  }
  if (autoMode) toggleAuto();
});

autoBtn.addEventListener('click', toggleAuto);

function toggleAuto() {
  autoMode = !autoMode;
  autoBtn.classList.toggle('active', autoMode);
  autoBtn.textContent = autoMode ? '⏸ 정지 (Stop)' : '▶ 자동 재생 (Auto)';
  if (autoMode) {
    autoTimer = 0;
    currentN = 1;
    slider.value = 1;
    geneValEl.textContent = 1;
    initBars(1);
  }
}

// ============================================================
// Mouse hover
// ============================================================
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  hoveredBar = -1;
  for (let i = 0; i < barRects.length; i++) {
    const b = barRects[i];
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
      hoveredBar = i;
      break;
    }
  }

  if (hoveredBar >= 0) {
    const total = 2 * currentN;
    const k = hoveredBar;
    const prob = binomProb(total, k);
    const frac = k / total;
    const sc = skinColor(frac);
    tooltip.innerHTML = `<b>검은 대립유전자 ${k}개 / ${total}개</b><br>` +
      `확률: ${(prob * 100).toFixed(2)}%<br>` +
      `피부색: <span class="swatch" style="background:${sc}"></span>`;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
    if (SLIDE_MODE) {
      tooltip.style.background = 'rgba(240,236,228,0.97)';
      tooltip.style.color = '#1a1a1a';
      tooltip.style.borderColor = '#2e7d32';
    }
  } else {
    tooltip.style.display = 'none';
  }
});
canvas.addEventListener('mouseleave', () => {
  hoveredBar = -1;
  tooltip.style.display = 'none';
});

// ============================================================
// Easing
// ============================================================
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// ============================================================
// Punnett square helper
// ============================================================
function drawPunnettSquare(cx, cy, n) {
  // Only for n <= 3
  if (n > 3) return;
  const total = 2 * n;
  // Punnett square: gametes from each parent
  // Each parent contributes n alleles, each can be D or d
  // Gamete possibilities: 2^n
  const numGametes = Math.pow(2, n);
  // For n=2: 4 gametes each parent -> 4x4 grid
  // For n=3: 8x8 grid -> small cells

  const maxCells = numGametes;
  const cellSize = n <= 2 ? 28 : 16;
  const gridW = maxCells * cellSize;
  const gridH = maxCells * cellSize;
  const startX = cx - gridW / 2;
  const startY = cy - gridH / 2;

  // Header
  ctx.fillStyle = txtColor();
  ctx.font = `bold ${n <= 2 ? 13 : 10}px 'Noto Sans KR'`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('Punnett Square (퍼넷 사각형)', cx, startY - 8);

  // Generate gametes: count of D alleles in each gamete
  function gameteD(index, nGenes) {
    let count = 0;
    for (let bit = 0; bit < nGenes; bit++) {
      if (index & (1 << bit)) count++;
    }
    return count;
  }

  for (let r = 0; r < numGametes; r++) {
    for (let c = 0; c < numGametes; c++) {
      const dCount = gameteD(r, n) + gameteD(c, n);
      const frac = dCount / total;
      const x = startX + c * cellSize;
      const y = startY + r * cellSize;
      ctx.fillStyle = skinColor(frac);
      ctx.fillRect(x, y, cellSize - 1, cellSize - 1);
      if (hoveredBar >= 0 && dCount === hoveredBar) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, cellSize - 1, cellSize - 1);
      }
    }
  }

  // Border
  ctx.strokeStyle = barBorder();
  ctx.lineWidth = 1;
  ctx.strokeRect(startX, startY, gridW - 1, gridH - 1);

  // Labels
  ctx.fillStyle = dimColor();
  ctx.font = `${n <= 2 ? 11 : 9}px 'Noto Sans KR'`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('부 배우자 (Father)', cx, startY + gridH + 4);
  ctx.save();
  ctx.translate(startX - 8, cy);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('모 배우자 (Mother)', 0, 0);
  ctx.restore();
}

// ============================================================
// Main draw
// ============================================================
function draw() {
  resetTransform();
  ctx.clearRect(0, 0, W, H);
  // Background
  ctx.fillStyle = canvasBg();
  ctx.fillRect(0, 0, W, H);

  const n = currentN;
  const total = 2 * n;
  const numBars = total + 1;

  // Whether to show Punnett square
  const showPunnett = n <= 3;
  const histLeft = 60;
  const histRight = showPunnett ? 580 : W - 60;
  const histWidth = histRight - histLeft;
  const histTop = 90;
  const histBottom = 370;
  const histH = histBottom - histTop;

  // ---- 1. Genotype info (top) ----
  ctx.fillStyle = txtColor();
  ctx.font = "bold 17px 'Noto Sans KR'";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(`유전자 수: ${n}개  →  대립유전자 조합: ${numBars}가지 표현형`, showPunnett ? (histLeft + histRight) / 2 : W / 2, 18);

  ctx.fillStyle = dimColor();
  ctx.font = "14px 'JetBrains Mono'";
  ctx.fillText(`가능한 표현형 수 = 2n + 1 = 2×${n} + 1 = ${numBars}`, showPunnett ? (histLeft + histRight) / 2 : W / 2, 48);

  // ---- 2. Distribution histogram ----
  const maxProb = Math.max(...targetBars);
  const barGap = Math.max(2, Math.min(6, 60 / numBars));
  const barW = Math.max(8, (histWidth - barGap * (numBars + 1)) / numBars);
  const totalBarsWidth = numBars * barW + (numBars - 1) * barGap;
  const barsStartX = histLeft + (histWidth - totalBarsWidth) / 2;

  barRects = [];

  for (let k = 0; k <= total; k++) {
    const prob = animBars[k] || 0;
    const barH = maxProb > 0 ? (prob / maxProb) * (histH - 30) : 0;
    const x = barsStartX + k * (barW + barGap);
    const y = histBottom - barH;
    const frac = k / total;

    ctx.fillStyle = skinColor(frac);
    if (barH > 0) {
      // Rounded top
      const r = Math.min(4, barW / 2);
      ctx.beginPath();
      ctx.moveTo(x, histBottom);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.arcTo(x + barW, y, x + barW, y + r, r);
      ctx.lineTo(x + barW, histBottom);
      ctx.closePath();
      ctx.fill();
    }

    // Highlight on hover
    if (hoveredBar === k) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 1, y - 1, barW + 2, barH + 2);
    }

    barRects.push({ x, y, w: barW, h: barH > 0 ? barH : histH });
    // Fix: make hoverable area extend to bottom
    barRects[k].y = Math.min(y, histBottom - 10);
    barRects[k].h = histBottom - barRects[k].y;

    // Probability label (when n <= 4)
    if (n <= 4 && animProgress >= 0.8) {
      const probVal = targetBars[k];
      ctx.fillStyle = dimColor();
      ctx.font = `${barW < 30 ? 9 : 11}px 'JetBrains Mono'`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText((probVal * 100).toFixed(1) + '%', x + barW / 2, y - 4);
    }

    // X-axis label
    ctx.fillStyle = dimColor();
    ctx.font = `${barW < 20 ? 9 : 11}px 'JetBrains Mono'`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(k.toString(), x + barW / 2, histBottom + 4);
  }

  // X-axis label
  ctx.fillStyle = subColor();
  ctx.font = "13px 'Noto Sans KR'";
  ctx.textAlign = 'center';
  ctx.fillText('검은 대립유전자 수 (Dark allele count)', (histLeft + histRight) / 2, histBottom + 22);

  // Y-axis label
  ctx.save();
  ctx.fillStyle = subColor();
  ctx.font = "13px 'Noto Sans KR'";
  ctx.translate(20, (histTop + histBottom) / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillText('확률 (Probability)', 0, 0);
  ctx.restore();

  // ---- Normal distribution overlay ----
  if (animProgress > 0.3) {
    const mu = n; // mean of binomial(2n, 0.5)
    const sigma = Math.sqrt(n / 2); // std dev
    const curveAlpha = Math.min(1, (animProgress - 0.3) / 0.5);

    ctx.beginPath();
    ctx.strokeStyle = SLIDE_MODE
      ? `rgba(200, 50, 30, ${0.8 * curveAlpha})`
      : `rgba(255, 120, 60, ${0.8 * curveAlpha})`;
    ctx.lineWidth = 2.5;

    const maxNorm = normalPDF(mu, mu, sigma);
    const scaleY = (maxProb > 0 ? 1 : 0) * (histH - 30) / maxProb;

    for (let px = 0; px <= histWidth; px++) {
      const xVal = (px / histWidth) * total;
      const nVal = normalPDF(xVal, mu, sigma);
      // Scale to match bar heights
      const barEquivProb = nVal; // continuous density
      // Map: nVal / maxNorm * maxProb -> pixel height
      const py = histBottom - (nVal / maxNorm) * maxProb * scaleY;
      if (px === 0) ctx.moveTo(histLeft + px, py);
      else ctx.lineTo(histLeft + px, py);
    }
    ctx.stroke();

    // Label for normal curve
    ctx.fillStyle = SLIDE_MODE ? 'rgba(200,50,30,0.9)' : 'rgba(255,120,60,0.9)';
    ctx.font = "bold 12px 'Noto Sans KR'";
    ctx.textAlign = 'left';
    ctx.fillText('정규분포 근사 (Normal approx.)', histLeft + 8, histTop + 8);
  }

  // ---- 3. Skin color strip ----
  const stripY = 440;
  const stripH = 32;
  const circR = Math.min(14, (histWidth / numBars - 2) / 2);
  const stripTotalW = numBars * (circR * 2 + 4);
  const stripStartX = (showPunnett ? (histLeft + histRight) / 2 : W / 2) - stripTotalW / 2;

  ctx.fillStyle = txtColor();
  ctx.font = "bold 14px 'Noto Sans KR'";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('표현형 스펙트럼 (Phenotype Spectrum)', showPunnett ? (histLeft + histRight) / 2 : W / 2, stripY - 22);

  for (let k = 0; k <= total; k++) {
    const frac = k / total;
    const cx = stripStartX + k * (circR * 2 + 4) + circR;
    const cy = stripY + stripH / 2;

    ctx.beginPath();
    ctx.arc(cx, cy, circR, 0, Math.PI * 2);
    ctx.fillStyle = skinColor(frac);
    ctx.fill();
    ctx.strokeStyle = barBorder();
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Arrow underneath
  ctx.fillStyle = dimColor();
  ctx.font = "11px 'Noto Sans KR'";
  ctx.textAlign = 'left';
  ctx.fillText('밝음', stripStartX - 4, stripY + stripH + 6);
  ctx.textAlign = 'right';
  ctx.fillText('어두움', stripStartX + stripTotalW + 4, stripY + stripH + 6);
  // Arrow line
  ctx.strokeStyle = dimColor();
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(stripStartX + 20, stripY + stripH + 12);
  ctx.lineTo(stripStartX + stripTotalW - 20, stripY + stripH + 12);
  ctx.stroke();
  // Arrowhead
  ctx.beginPath();
  ctx.moveTo(stripStartX + stripTotalW - 20, stripY + stripH + 12);
  ctx.lineTo(stripStartX + stripTotalW - 28, stripY + stripH + 8);
  ctx.lineTo(stripStartX + stripTotalW - 28, stripY + stripH + 16);
  ctx.closePath();
  ctx.fillStyle = dimColor();
  ctx.fill();

  // ---- 4. Key insight text ----
  const insightY = 520;
  ctx.textAlign = 'center';

  let insight1 = '';
  if (n === 1) {
    insight1 = `유전자 1개 → 3가지 표현형 (멘델의 1:2:1 비율 그대로!)`;
  } else if (n <= 3) {
    insight1 = `유전자 ${n}개 → ${numBars}가지 표현형 (뚜렷한 계단형 분포)`;
  } else if (n <= 6) {
    insight1 = `유전자 ${n}개 → ${numBars}가지 표현형 (종 모양에 가까워짐)`;
  } else {
    insight1 = `유전자 ${n}개 → ${numBars}가지 표현형 (사실상 정규분포 = 연속적 양적 형질!)`;
  }
  ctx.fillStyle = txtColor();
  ctx.font = "bold 15px 'Noto Sans KR'";
  ctx.fillText(insight1, W / 2, insightY);

  // Fisher's conclusion
  ctx.fillStyle = SLIDE_MODE ? '#2e7d32' : '#4caf50';
  ctx.font = "bold 14px 'Noto Sans KR'";
  const fisher1 = '"양적 형질도 멘델 유전법칙을 따르는 다수 유전자의 결과"';
  ctx.fillText(fisher1, W / 2, insightY + 34);

  ctx.fillStyle = dimColor();
  ctx.font = "13px 'Noto Sans KR'";
  ctx.fillText('— R.A. Fisher, "The Correlation between Relatives on the Supposition of Mendelian Inheritance" (1918)', W / 2, insightY + 60);

  // ---- Additional formula ----
  ctx.fillStyle = dimColor();
  ctx.font = "12px 'JetBrains Mono'";
  ctx.fillText(`P(k) = C(${total}, k) / 2^${total}    |    평균(mean) = ${n}    |    표준편차(std) = √(n/2) ≈ ${Math.sqrt(n / 2).toFixed(2)}`, W / 2, insightY + 90);

  // Insight messages for specific n values
  if (n === 1) {
    ctx.fillStyle = subColor();
    ctx.font = "12px 'Noto Sans KR'";
    ctx.fillText('n=1: DD, Dd, dd — 멘델이 발견한 단일 유전자 유전. 양적 형질의 출발점', W / 2, insightY + 118);
  } else if (n === 2) {
    ctx.fillStyle = subColor();
    ctx.font = "12px 'Noto Sans KR'";
    ctx.fillText('n=2: 피부색이 5단계로만 나뉨 — 불연속적 형질처럼 보임', W / 2, insightY + 118);
  } else if (n === 5) {
    ctx.fillStyle = subColor();
    ctx.font = "12px 'Noto Sans KR'";
    ctx.fillText('n=5: 11단계 — 이미 종 모양 곡선에 가까움!', W / 2, insightY + 118);
  } else if (n === 10) {
    ctx.fillStyle = subColor();
    ctx.font = "12px 'Noto Sans KR'";
    ctx.fillText('n=10: 21단계 — 연속적 분포와 거의 구별 불가. Fisher가 증명한 핵심!', W / 2, insightY + 118);
  } else if (n >= 15) {
    ctx.fillStyle = subColor();
    ctx.font = "12px 'Noto Sans KR'";
    ctx.fillText(`n=${n}: ${numBars}단계 — 완벽한 정규분포. 개별 유전자 효과는 구별 불가`, W / 2, insightY + 118);
  }

  // ---- 5. Punnett square (right side, n<=3) ----
  if (showPunnett) {
    const punnettCx = 770;
    const punnettCy = 220;
    drawPunnettSquare(punnettCx, punnettCy, n);
  }
}

// ============================================================
// Animation loop
// ============================================================
let lastTime = 0;
const ANIM_DURATION = 600; // ms

function animate(timestamp) {
  if (lastTime === 0) lastTime = timestamp;
  const dt = Math.min(timestamp - lastTime, 50); // cap dt
  lastTime = timestamp;

  // Animate bars with easing
  if (animProgress < 1) {
    animProgress = Math.min(1, animProgress + dt / ANIM_DURATION);
    const t = easeInOutCubic(animProgress);
    for (let i = 0; i < targetBars.length; i++) {
      const from = (i < fromBars.length) ? fromBars[i] : 0;
      animBars[i] = from + (targetBars[i] - from) * t;
    }
  } else {
    for (let i = 0; i < targetBars.length; i++) {
      animBars[i] = targetBars[i];
    }
  }

  // Auto-play
  if (autoMode) {
    autoTimer += dt;
    if (autoTimer > 1500) {
      autoTimer = 0;
      let nextN = currentN + 1;
      if (nextN > 20) {
        toggleAuto();
      } else {
        currentN = nextN;
        slider.value = nextN;
        geneValEl.textContent = nextN;
        initBars(nextN);
      }
    }
  }

  draw();
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
